<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinTel Trending</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="page-shell">
        <div class="ambient ambient-one"></div>
        <div class="ambient ambient-two"></div>
        <div class="ambient ambient-three"></div>

        <section class="analysis-topbar">
            <a class="site-wordmark" href="/" aria-label="FinTel home"><span class="wordmark-icon">F</span><span>fintel<small>INDIA MARKETS</small></span></a>
            <nav class="site-nav" aria-label="Main navigation"><a href="/">Search stocks</a></nav>
        </section>

        <main class="dashboard trending-page">
            <section class="glass trending-hero-card">
                <div class="section-head">
                    <div>
                        <p class="section-kicker">The market board</p>
                        <h1 class="trending-title">A closer look at<br>Indian markets.</h1>
                    </div>
                    <div id="trending-status" class="sidebar-status">Refreshing on reload</div>
                </div>
                <p class="trending-copy">A rotating selection of familiar names, compared against a short-term model outlook. Forecasts are estimates, not guarantees.</p>
            </section>

            <section class="glass trending-board">
                <div id="trending-list" class="trending-list trending-list-page">
                    <article class="trending-item trending-loading">
                        <div class="trending-meta">
                            <strong>Loading stocks...</strong>
                            <span>Pulling current and forecast values</span>
                        </div>
                    </article>
                </div>
            </section>
        </main>
    </div>

    <script src="/trending.js?v=2"></script>
</body>
</html>
